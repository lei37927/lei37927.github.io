# 密钥建议用 secrets 设置，不要把明文提交到 GitHub：
#   npx wrangler secret put SYNC_KEY
# 如果想省事直接写在配置文件里（注意：仓库公开时密钥会暴露），可取消下面一行注释：
# [vars]
# SYNC_KEY = "填一长串随机字符，网页里要填同一个"
