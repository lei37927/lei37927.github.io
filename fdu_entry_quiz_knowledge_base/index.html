<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FDU 入学教育测试知识库</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#ABDBC3;--primary-dark:#8FC9AD;--primary-darker:#6FB393;--primary-deep:#4F9D79;--primary-ink:#2D7A5A;--primary-light:#D5EDDF;--primary-bg:#EEF8F2;--multi:#D4956B;--multi-dark:#B8764A;--multi-bg:#FBF1E8;--judge:#8B9DC9;--judge-dark:#6B7FAE;--judge-bg:#EEF1F8;--other:#C9A84A;--other-dark:#A8882E;--other-bg:#FAF5E8;--bg:#F4F7F6;--card:#FFF;--text1:#2C3E3A;--text2:#5A6B66;--text3:#98A8A3;--border:#E0E8E5;--shadow-sm:0 1px 3px rgba(45,122,90,.06);--shadow-md:0 4px 14px rgba(45,122,90,.08);--shadow-lg:0 8px 28px rgba(45,122,90,.12);--radius:14px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--text1);line-height:1.7;min-height:100vh}
.hero{background:linear-gradient(135deg,#2D6B55 0%,#3D8568 30%,#5FA385 60%,#8FC9AD 85%,#ABDBC3 100%);color:#fff;padding:44px 32px 36px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50%;left:-10%;width:120%;height:200%;background:radial-gradient(circle at 25% 40%,rgba(255,255,255,.07) 0%,transparent 45%),radial-gradient(circle at 75% 60%,rgba(213,237,223,.08) 0%,transparent 40%);pointer-events:none}
.hero h1{font-size:30px;font-weight:800;margin-bottom:6px;letter-spacing:1px;position:relative;text-shadow:0 2px 8px rgba(0,0,0,.12)}
.hero .sub{font-size:14px;color:#D5EDDF;margin-bottom:24px;position:relative}
.search-wrap{max-width:620px;margin:0 auto;position:relative}
.search-box{position:relative;transition:transform .25s ease}
.search-box:hover{transform:translateY(-1px)}
.search-box input{width:100%;padding:16px 20px 16px 50px;border:2px solid transparent;border-radius:14px;font-size:16px;background:rgba(255,255,255,.97);color:var(--text1);outline:none;transition:all .3s cubic-bezier(.4,0,.2,1);box-shadow:0 4px 18px rgba(0,0,0,.14)}
.search-box input::placeholder{color:#A8B8B3}
.search-box input:focus{border-color:var(--primary-dark);box-shadow:0 0 0 4px rgba(171,219,195,.35),0 8px 28px rgba(0,0,0,.18);transform:scale(1.01)}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--text3);transition:color .3s,transform .3s;pointer-events:none}
.search-box input:focus~.search-icon{color:var(--primary-deep);transform:translateY(-50%) scale(1.15)}
.search-clear{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;background:#D8E0DD;color:var(--text2);border:none;cursor:pointer;font-size:15px;display:none;align-items:center;justify-content:center;transition:all .2s}
.search-clear:hover{background:var(--text3);color:#fff;transform:translateY(-50%) rotate(90deg)}
.search-clear.show{display:flex}
.search-hint{margin-top:10px;font-size:12px;color:#A8C5BC;position:relative}
.container{display:flex;max-width:1400px;margin:0 auto;padding:24px 32px 48px;gap:28px}
.sidebar{width:250px;flex-shrink:0;position:sticky;top:20px;align-self:flex-start}
.sidebar h3{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:2px;margin-bottom:14px;padding-left:10px;font-weight:700}
.cat-list{list-style:none}
.cat-item{padding:12px 16px;border-radius:11px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--text2);margin-bottom:4px;transition:all .2s cubic-bezier(.4,0,.2,1);font-weight:500;border:1px solid transparent;position:relative;overflow:hidden}
.cat-item::before{content:'';position:absolute;left:0;top:0;width:3px;height:100%;background:var(--primary-darker);transform:scaleY(0);transition:transform .2s}
.cat-item:hover{background:var(--primary-bg);color:var(--primary-ink);transform:translateX(4px)}
.cat-item:hover::before{transform:scaleY(1)}
.cat-item.active{background:linear-gradient(135deg,var(--primary-darker) 0%,var(--primary) 100%);color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(111,179,147,.3)}
.cat-item.active::before{transform:scaleY(1);background:#fff}
.cat-item .count{font-size:11px;background:rgba(0,0,0,.07);padding:2px 10px;border-radius:12px;font-weight:700;transition:all .2s}
.cat-item.active .count{background:rgba(255,255,255,.25)}
.cat-item:hover .count{background:rgba(111,179,147,.12)}
.main{flex:1;min-width:0}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.section-title{font-size:20px;font-weight:800;color:var(--text1);position:relative;padding-bottom:8px}
.section-title::after{content:'';position:absolute;bottom:0;left:0;width:44px;height:4px;background:linear-gradient(90deg,var(--primary-darker),var(--primary));border-radius:2px}
.result-count{font-size:13px;color:var(--text3);font-weight:500}
.q-card{background:var(--card);border-radius:var(--radius);padding:22px 26px;margin-bottom:14px;box-shadow:var(--shadow-sm);border-left:5px solid #CBD5D1;transition:all .25s cubic-bezier(.4,0,.2,1);animation:fadeInUp .4s ease both;position:relative;overflow:hidden}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.q-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.q-card.single{border-left-color:var(--primary-darker)}
.q-card.single:hover{border-left-color:var(--primary)}
.q-card.multiple{border-left-color:var(--multi)}
.q-card.multiple:hover{border-left-color:var(--multi-dark)}
.q-card.truefalse{border-left-color:var(--judge)}
.q-card.truefalse:hover{border-left-color:var(--judge-dark)}
.q-card.other{border-left-color:var(--other)}
.q-card.other:hover{border-left-color:var(--other-dark)}
.q-header{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px}
.q-number{font-size:12px;color:var(--text3);font-weight:700;min-width:44px;padding-top:3px;font-variant-numeric:tabular-nums}
.q-text{flex:1;font-size:16px;font-weight:600;color:var(--text1);line-height:1.8}
.q-type-tag{font-size:11px;padding:4px 12px;border-radius:12px;font-weight:700;white-space:nowrap;transition:transform .2s}
.q-card:hover .q-type-tag{transform:scale(1.05)}
.q-type-tag.single{background:var(--primary-bg);color:var(--primary-ink)}
.q-type-tag.multiple{background:var(--multi-bg);color:var(--multi-dark)}
.q-type-tag.truefalse{background:var(--judge-bg);color:var(--judge-dark)}
.q-type-tag.other{background:var(--other-bg);color:var(--other-dark)}
.q-options{margin:14px 0 14px 52px}
.q-option{font-size:14px;color:var(--text2);padding:7px 12px;display:flex;gap:8px;line-height:1.7;border-radius:7px;transition:all .2s;cursor:default}
.q-option:hover{background:var(--primary-bg);color:var(--text1);transform:translateX(3px)}
.q-option .opt-letter{font-weight:700;color:var(--text3);min-width:22px;transition:color .2s}
.q-option:hover .opt-letter{color:var(--primary-darker)}
.q-answer{margin-top:14px;margin-left:52px;padding:14px 18px;background:linear-gradient(135deg,var(--primary-bg) 0%,#E6F5EE 100%);border-radius:11px;border-left:4px solid var(--primary-darker);position:relative;transition:all .25s}
.q-card:hover .q-answer{box-shadow:0 2px 10px rgba(111,179,147,.15)}
.q-answer .ans-label{font-size:11px;font-weight:800;color:var(--primary-ink);margin-bottom:8px;text-transform:uppercase;letter-spacing:1.5px;display:flex;align-items:center;gap:8px}
.q-answer .ans-label::before{content:'\2713';display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;background:var(--primary-darker);color:#fff;border-radius:50%;font-size:12px;font-weight:700}
.q-answer .ans-lines{padding-left:28px}
.q-answer .ans-line{font-size:17px;color:var(--text1);font-weight:700;line-height:1.8;padding:3px 0;display:flex;align-items:flex-start;gap:8px}
.q-answer .ans-line::before{content:'';display:inline-block;width:7px;height:7px;margin-top:8px;background:var(--primary-darker);border-radius:50%;flex-shrink:0}
.q-answer .ans-text-single{font-size:17px;color:var(--text1);font-weight:700;line-height:1.7;padding-left:28px}
.empty{text-align:center;padding:70px 20px;color:var(--text3);animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.empty .icon{font-size:56px;margin-bottom:16px;opacity:.5}
.empty .text{font-size:16px;font-weight:500}
.empty .sub{font-size:13px;margin-top:6px;color:#B8C5C1}
.footer{text-align:center;padding:28px;color:var(--text3);font-size:12px;border-top:1px solid var(--border);background:var(--card)}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#B8CCC6;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--primary-dark)}
@media(max-width:900px){.hero{padding:28px 18px 24px}.hero h1{font-size:22px}.container{flex-direction:column;padding:18px 14px}.sidebar{width:100%;position:static}.cat-list{display:flex;flex-wrap:wrap;gap:5px}.cat-item{margin-bottom:0;padding:7px 12px;font-size:12px}.cat-item:hover{transform:none}.q-options,.q-answer{margin-left:0}.q-text{font-size:14px}.q-option{font-size:13px}.q-answer .ans-line,.q-answer .ans-text-single{font-size:16px}}
</style>
</head>
<body>
<div class="hero">
<h1>FDU 入学教育测试知识库</h1>
<div class="sub">共 172 道题目 · 实时搜索 · 答案直接展示</div>

</ul>
</div>
<div class="main">
<div class="section-header">
<div class="section-title" id="secTitle">全部题目</div>

</div>
<div id="qList"></div>

</div>
</div>
